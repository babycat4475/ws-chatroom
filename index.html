<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebSocket 实时聊天</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Heiti SC",system-ui,sans-serif;background:linear-gradient(160deg,#0d1b2a,#1b263b 60%,#0b1320);color:#e8eef7;height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.app{width:100%;max-width:860px;height:88vh;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(6px)}
.top{display:flex;align-items:center;gap:10px;padding:14px 18px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08)}
.dot{width:10px;height:10px;border-radius:50%;background:#f55}
.dot.on{background:#31d17a;box-shadow:0 0 8px #31d17a}
.title{font-weight:800;font-size:16px}
.status{font-size:12px;color:#8ea3bd;margin-left:auto}
.online{font-size:12px;color:#9db6d6;background:rgba(255,255,255,.08);padding:5px 10px;border-radius:20px}
#feed{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:76%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word;position:relative}
.me{align-self:flex-end;background:#3b82f6;color:#fff;border-bottom-right-radius:4px}
.other{align-self:flex-start;background:rgba(255,255,255,.12);border-bottom-left-radius:4px}
.who{font-size:11px;color:#9db6d6;margin-bottom:3px}
.t{font-size:10px;opacity:.65;margin-top:4px;text-align:right}
.sys{align-self:center;font-size:12px;color:#8ea3bd;background:rgba(255,255,255,.05);padding:4px 12px;border-radius:12px}
.bar{display:flex;gap:10px;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04)}
input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;color:#e8eef7;font-size:14px;outline:none}
input::placeholder{color:#7b8ea6}
button{border:none;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:800;cursor:pointer;background:#3b82f6;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
#join{position:absolute;inset:0;background:rgba(8,14,24,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9}
#join h2{font-size:22px}
#join input,#accounts{flex:none;width:min(280px,85%);text-align:center}
#accounts{font:inherit;color:#e8eef7;background:#23334b;border:1px solid #51627b;border-radius:12px;padding:10px}
#switch{padding:6px 10px;background:#293c55;font-size:12px}
#loginError{color:#ffc09b;font-size:13px;max-width:82%;text-align:center}
#join small{color:#7b8ea6}
.wrap{position:relative;width:100%;max-width:860px;height:88vh}
#historyBtn,#switch{padding:6px 10px;background:#293c55;font-size:12px}
#historyPanel{position:fixed;inset:0;z-index:20;background:rgba(4,8,14,.72);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
#historyPanel.open{display:flex}
.hist-card{width:min(720px,100%);height:min(82vh,700px);background:#101b2b;border:1px solid #33445e;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.hist-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.hist-head b{font-size:16px}
.hist-head span{font-size:12px;color:#8ea3bd}
.hist-head button{margin-left:auto;padding:6px 10px;background:#293c55;font-size:12px}
.hist-tools{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.hist-tools input{padding:9px 11px;font-size:13px;border-radius:9px}
.hist-tools button{padding:9px 14px;font-size:12px}
#histList{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.hist-item{background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px}
.hist-meta{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#9db6d6;margin-bottom:3px}
.hist-text{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:#e8eef7}
.hist-empty{color:#8ea3bd;font-size:13px;text-align:center;padding:30px 0}
.hist-foot{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid rgba(255,255,255,.08)}
.hist-foot button{padding:7px 12px;background:#293c55;font-size:12px}
.hist-foot span{font-size:11px;color:#8ea3bd;margin-left:auto}
</style></head><body>
<div class="wrap">
<div class="app">
  <div class="top">
    <span class="dot" id="dot"></span>
    <span class="title">💬 WebSocket 实时聊天</span>
    <span class="online" id="online">在线 0</span>
    <button id="historyBtn" hidden>聊天记录</button>
    <span class="status" id="status">未连接</span>
    <button id="switch" hidden>切换账号</button>
  </div>
  <div id="feed"></div>
  <div class="bar">
    <input id="text" placeholder="输入消息，回车发送…" disabled>
    <button id="send" disabled>发送</button>
  </div>
</div>
<div id="historyPanel" aria-hidden="true">
  <div class="hist-card" role="dialog" aria-modal="true" aria-label="聊天记录">
    <div class="hist-head">
      <b>聊天记录</b><span id="histHint">最近 50 条</span>
      <button id="histClose" type="button">关闭</button>
    </div>
    <div class="hist-tools">
      <input id="histSearch" placeholder="搜索昵称或消息内容…" maxlength="100">
      <button id="histSearchBtn" type="button">搜索</button>
    </div>
    <div id="histList"></div>
    <div class="hist-foot">
      <button id="histMore" type="button">加载更早</button>
      <span id="histStatus"></span>
    </div>
  </div>
</div>
<div id="join">
  <h2>加入聊天室</h2>
  <label for="accounts">选择此浏览器保存的账号</label>
  <select id="accounts"></select>
  <input id="name" aria-label="新账号昵称" placeholder="输入新账号的昵称" maxlength="16">
  <button id="go">创建并进入</button>
  <div id="loginError" role="status"></div>
  <small id="wshint">连接地址：ws://localhost:8765</small>
</div>
</div>
<script>
var $ = function(s){ return document.querySelector(s); };
var ws = null, me = "", myId = "";
var sessionKey = "chat-session:" + location.pathname;
var accountPrefix = "ws-chat/account:" + new URL(".", document.baseURI).pathname + ":";
var profiles = new Map();

function updateLoginForm(){
  var creating = !$("#accounts").value;
  $("#name").hidden = !creating;
  $("#go").textContent = creating ? "创建并进入" : "进入聊天室";
}
function loadAccounts(){
  var chooser = $("#accounts"), selected = chooser.options.length ? chooser.value : null;
  chooser.replaceChildren();
  profiles.clear();
  try {
    for (var i = 0; i < localStorage.length; i++){
      var key = localStorage.key(i);
      if (!key || !key.startsWith(accountPrefix)) continue;
      var id = key.slice(accountPrefix.length);
      var profile;
      try { profile = JSON.parse(localStorage.getItem(key)); } catch (e) { continue; }
      if (!profile || typeof profile.name !== "string" || !/^[0-9a-f]{64}$/.test(id) ||
          !/^[0-9a-f]{64}$/.test(profile.token)) continue;
      profiles.set(id, profile);
      chooser.add(new Option(profile.name + " · " + id.slice(0, 6), id));
    }
    var old = sessionStorage.getItem(sessionKey);
    if (old && /^[0-9a-f]{64}$/.test(old) && !Array.from(profiles.values()).some(p => p.token === old)){
      profiles.set("old", {name:"原访客",token:old});
      chooser.add(new Option("沿用此标签页的旧身份", "old"));
    }
  } catch (e) {
    $("#loginError").textContent = "请允许此网站保存浏览器数据，以便下次选择账号。";
  }
  chooser.add(new Option("创建新账号", ""));
  if (selected === "" || profiles.has(selected)) chooser.value = selected;
  updateLoginForm();
}
function showChat(m){
  addMsg(m.name + " · " + m.sender_id.slice(0, 6), m.text, m.ts, m.sender_id === myId);
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function addSys(t){ var d=document.createElement("div"); d.className="sys"; d.textContent=t; $("#feed").appendChild(d); $("#feed").scrollTop=$("#feed").scrollHeight; }
function addMsg(name, text, ts, mine){
  var d=document.createElement("div"); d.className="msg "+(mine?"me":"other");
  d.innerHTML = (mine?"":"<div class=who>"+esc(name)+"</div>") + esc(text) + "<div class=t>"+esc(ts||"")+"</div>";
  $("#feed").appendChild(d); $("#feed").scrollTop=$("#feed").scrollHeight;
}
function setOnline(list){ $("#online").textContent = "在线 " + (list?list.length:0); }

var historyOpen = false, historyBefore = null, historyQuery = "", historyHasMore = false;
var historyLoading = false, historyResetPending = false;

function historyItem(m){
  var item = document.createElement("div"); item.className = "hist-item";
  var meta = document.createElement("div"); meta.className = "hist-meta";
  var who = document.createElement("span");
  who.textContent = (m.name || "匿名") + " · " + (m.sender_id || "").slice(0, 6);
  var time = document.createElement("span"); time.textContent = m.ts || "";
  meta.appendChild(who); meta.appendChild(time);
  var body = document.createElement("div"); body.className = "hist-text"; body.textContent = m.text || "";
  item.appendChild(meta); item.appendChild(body);
  return item;
}

function requestHistory(reset){
  if (!ws || ws.readyState !== 1 || historyLoading) return;
  historyLoading = true;
  historyResetPending = reset;
  var req = {type:"history", limit:50};
  if (historyQuery) req.query = historyQuery;
  if (!reset && historyBefore) req.before_id = historyBefore;
  ws.send(JSON.stringify(req));
}

function loadHistory(reset){
  if (reset) {
    historyBefore = null;
    historyHasMore = false;
    historyQuery = $("#histSearch").value.trim();
  }
  requestHistory(reset);
}

function openHistory(){
  if (!myId) return;
  historyOpen = true;
  historyLoading = false;
  historyBefore = null;
  historyQuery = "";
  historyHasMore = false;
  $("#histSearch").value = "";
  $("#histList").innerHTML = "";
  $("#histStatus").textContent = "";
  $("#histHint").textContent = "最近 50 条";
  $("#histMore").disabled = true;
  $("#historyPanel").classList.add("open");
  $("#historyPanel").setAttribute("aria-hidden", "false");
  requestHistory(true);
}

function closeHistory(){
  historyOpen = false;
  $("#historyPanel").classList.remove("open");
  $("#historyPanel").setAttribute("aria-hidden", "true");
}

function applyHistory(m){
  historyLoading = false;
  if (!historyOpen) return;
  var list = $("#histList");
  var reset = historyResetPending;
  historyResetPending = false;
  var items = m.messages || [];
  var oldHeight = list.scrollHeight;

  if (reset) list.innerHTML = "";
  if (!items.length && reset) {
    var empty = document.createElement("div");
    empty.className = "hist-empty";
    empty.textContent = historyQuery ? "没有找到匹配的聊天记录。" : "还没有聊天记录。";
    list.appendChild(empty);
  } else {
    var frag = document.createDocumentFragment();
    items.forEach(function(m){ frag.appendChild(historyItem(m)); });
    if (reset || !list.firstChild) list.appendChild(frag);
    else list.insertBefore(frag, list.firstChild);
  }

  historyHasMore = !!m.has_more;
  historyBefore = m.next_before || (items.length ? items[0].id : null);
  $("#histMore").disabled = !historyHasMore;
  $("#histHint").textContent = historyQuery ? ("搜索：" + historyQuery) : "最近 50 条";
  $("#histStatus").textContent = historyHasMore ? "可继续加载更早记录" : "已到最早记录";
  if (reset) list.scrollTop = list.scrollHeight;
  else list.scrollTop += list.scrollHeight - oldHeight;
}

function connect(profile){
  // 自动适配：本地(http)用 ws://，公网隧道(https)自动用 wss://
  var WS_PROTO = (location.protocol === "https:") ? "wss://" : "ws://";
  ws = new WebSocket(WS_PROTO + location.host + new URL(".", document.baseURI).pathname);
  ws.onopen = function(){
    $("#dot").classList.add("on"); $("#status").textContent = "已连接";
    ws.send(JSON.stringify({type:"join", name:me, resume_token:profile ? profile.token : null}));
  };
  ws.onmessage = function(e){
    var m = JSON.parse(e.data);
    if (m.type === "welcome"){
      myId = m.sender_id;
      try {
        localStorage.setItem(accountPrefix + myId, JSON.stringify({name:m.name, token:m.resume_token}));
      } catch (err) {
        $("#loginError").textContent = "无法保存账号，请允许浏览器保存网站数据后重试。";
        ws.close();
        return;
      }
      if (profile && profile.token === m.resume_token) {
        try { if (sessionStorage.getItem(sessionKey) === profile.token) sessionStorage.removeItem(sessionKey); } catch (err) {}
      }
      $("#join").style.display = "none";
      $("#switch").hidden = false;
      $("#historyBtn").hidden = false;
      $("#status").textContent = m.name + " · " + myId.slice(0, 6);
      if (m.history.length) {
        addSys("最近 " + m.history.length + " 条聊天记录");
        m.history.forEach(showChat);
      }
      addSys("欢迎，" + m.name + " · " + myId.slice(0, 6) + "！");
      setOnline(m.online);
      $("#text").disabled = false; $("#send").disabled = false;
      $("#text").focus();
    }
    else if (m.type === "notice"){ addSys(m.text); }
    else if (m.type === "online"){ setOnline(m.online); }
    else if (m.type === "chat"){ showChat(m); }
    else if (m.type === "history"){ applyHistory(m); }
  };
  ws.onclose = function(){
    $("#dot").classList.remove("on"); $("#status").textContent = "已断开";
    $("#text").disabled = true; $("#send").disabled = true;
    $("#go").disabled = false;
    if ($("#join").style.display !== "none" && !$("#loginError").textContent)
      $("#loginError").textContent = "连接未完成，请确认服务器已启动后重试。";
    closeHistory();
    addSys("连接已断开（服务器关闭？）");
  };
  ws.onerror = function(){ addSys("连接出错，请确认服务器已启动"); };
}
function send(){
  var v = $("#text").value.trim();
  if (!v || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({type:"chat", text:v}));
  $("#text").value = "";
}
$("#go").onclick = function(){
  var profile = profiles.get($("#accounts").value);
  me = profile ? profile.name : $("#name").value.trim();
  if (!me) { $("#loginError").textContent = "请输入新账号的昵称。"; $("#name").focus(); return; }
  $("#loginError").textContent = "";
  $("#go").disabled = true;
  connect(profile);
};
$("#name").addEventListener("keydown", function(e){ if (e.key === "Enter") $("#go").click(); });
$("#send").onclick = send;
$("#text").addEventListener("keydown", function(e){ if (e.key === "Enter") send(); });
$("#accounts").onchange = updateLoginForm;
$("#switch").onclick = function(){ location.reload(); };
$("#historyBtn").onclick = openHistory;
$("#histClose").onclick = closeHistory;
$("#histMore").onclick = function(){ loadHistory(false); };
$("#histSearchBtn").onclick = function(){ loadHistory(true); };
$("#histSearch").addEventListener("keydown", function(e){ if (e.key === "Enter") loadHistory(true); });
$("#historyPanel").addEventListener("click", function(e){ if (e.target === this) closeHistory(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && historyOpen) closeHistory(); });
window.addEventListener("storage", function(event){
  if ((!event.key || event.key.startsWith(accountPrefix)) && !$("#go").disabled) loadAccounts();
});
loadAccounts();
if ($("#name").hidden) $("#accounts").focus(); else $("#name").focus();
(function(){ var p=(location.protocol==="https:")?"wss://":"ws://"; $("#wshint").textContent="连接地址："+p+location.host+new URL(".", document.baseURI).pathname; })();
</script>
</body></html>
